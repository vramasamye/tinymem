name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: onememory
          POSTGRES_PASSWORD: onememory
          POSTGRES_DB: onememory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onememory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
        env:
          ONEMEMORY_PG_URL: postgresql://onememory:onememory@localhost:5432/onememory

  # The Node-compatibility gate (ADR-0014): the unit suites run under Bun and import bun:test, so
  # they cannot prove what a user gets. This job builds, stages, packs and installs the tarballs
  # with npm + Node (Bun is stripped from PATH inside the smoke) and drives the real CLI.
  packed-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run scripts/release.ts stage
      - run: bun run scripts/release.ts pack
      - run: bun run scripts/smoke-packed.ts
